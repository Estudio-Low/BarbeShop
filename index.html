<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendify - Sistema de Agendamento Inteligente</title>
    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider text-emerald-400">AGENDIFY <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full uppercase">Cloud SaaS</span></h1>
            <div id="statusNuvem" class="text-xs text-emerald-400 flex items-center gap-1.5 bg-emerald-950/50 px-3 py-1 rounded-full border border-emerald-800/50">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Nuvem Conectada
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 my-auto">
        
        <!-- SELETOR DE NICHO / DEMONSTRAÇÃO -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-3 text-slate-200">Selecione o Nicho de Demonstração:</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="mudarNicho('barbearia')" class="nicho-btn p-3 rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-400 font-medium text-center transition">💈 Barbearia</button>
                <button onclick="mudarNicho('petshop')" class="nicho-btn p-3 rounded-xl border border-slate-800 bg-slate-800/50 text-slate-400 hover:border-slate-700 text-center transition">🐾 PetShop</button>
                <button onclick="mudarNicho('salao')" class="nicho-btn p-3 rounded-xl border border-slate-800 bg-slate-800/50 text-slate-400 hover:border-slate-700 text-center transition">💇 Salão de Beleza</button>
                <button onclick="mudarNicho('estetica')" class="nicho-btn p-3 rounded-xl border border-slate-800 bg-slate-800/50 text-slate-400 hover:border-slate-700 text-center transition">✨ Estética</button>
            </div>
        </div>

        <!-- FORMULÁRIO DE AGENDAMENTO -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 id="tituloEstabelecimento" class="text-xl font-bold text-white mb-6">Agende seu horário na Barbearia</h2>
            
            <form id="formAgendamento" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Seu Nome Completo</label>
                    <input type="text" id="clienteNome" required placeholder="Ex: João da Silva" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Seu WhatsApp / Telefone</label>
                        <input type="tel" id="clienteTelefone" required placeholder="(11) 99999-9999" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Serviço Desejado</label>
                        <select id="selectServico" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                            <option value="corte">Corte Profissional - R$ 45,00</option>
                            <option value="barba">Barba Completa - R$ 35,00</option>
                            <option value="combo">Combo Corte + Barba - R$ 70,00</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Data do Agendamento</label>
                        <input type="date" id="dataAgendamento" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Horário</label>
                        <select id="selectHorario" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 font-bold text-slate-950 py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    Confirmar Agendamento na Nuvem
                </button>
            </form>
        </div>

    </main>

    <!-- RODAPÉ -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-900">
        Agendify Cloud SaaS &copy; 2026 - Todos os direitos reservados.
    </footer>
